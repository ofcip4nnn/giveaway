<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gacha Giveaway</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
margin:0;
background:linear-gradient(135deg,#020617,#0f172a);
font-family:system-ui;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh
}
.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(16px);
padding:30px;
border-radius:24px;
width:92%;
max-width:360px;
text-align:center;
box-shadow:0 0 40px rgba(56,189,248,.6)
}
input{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:rgba(255,255,255,.12);
color:white;
outline:none;
margin-top:12px
}
button{
width:100%;
padding:14px;
border-radius:14px;
border:none;
margin-top:12px;
background:#38bdf8;
font-weight:bold
}
#gacha{
margin:18px 0;
border:2px dashed #38bdf8;
border-radius:16px;
padding:18px;
font-size:26px
}
.roll{animation:f .1s infinite alternate}
@keyframes f{from{opacity:.4}to{opacity:1}}
</style>
</head>
<body>

<div class="card">
<h2>🎁 Gacha Giveaway</h2>

<input id="name" placeholder="Nama kamu">

<button onclick="join()">Ikut Giveaway</button>

<div id="count"></div>

<div id="gacha">???</div>

<button onclick="draw()">GACHA (ADMIN)</button>
</div>

<script>
const SUPABASE_URL="https://zzkzngjlvkqscosonpqy.supabase.co"
const SUPABASE_KEY="sb_publishable_1nkUD-tVQln_fBu-m08dRA_Epdw-NE5"

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

let users=[]

async function load(){
 let {data}=await db.from("participants").select("name")
 users=data.map(x=>x.name)
 count.innerText="Peserta: "+users.length
}
load()

db.channel("live")
 .on("postgres_changes",
 {event:"*",schema:"public",table:"participants"},
 load).subscribe()

async function join(){
 let n=name.value.trim()
 if(!n) return alert("Isi nama!")

 let {error}=await db.from("participants").insert({name:n})
 if(error) return alert("Nama sudah ikut!")
}

function draw(){
 if(!users.length) return
 gacha.classList.add("roll")
 let i=0
 let t=setInterval(()=>{
  gacha.innerText=users[Math.floor(Math.random()*users.length)]
  i++
  if(i>22){
   clearInterval(t)
   gacha.classList.remove("roll")
   gacha.innerText="🎉 "+users[Math.floor(Math.random()*users.length)]
  }
 },90)
}
</script>
</body>
</html>
