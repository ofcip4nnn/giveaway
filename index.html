<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width=1.0">
<title>🎰 Giveaway Gacha Elegan</title>

<style>
:root{
--bg:#070b17;
--card:#121a33;
--glow:#00ffd5;
--text:#e9ecff;
}

body{
margin:0;
font-family:system-ui,Segoe UI,sans-serif;
background:radial-gradient(circle at top,#1a2450,#05070f);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:850px;
display:grid;
grid-template-columns:1.1fr .9fr;
gap:25px;
}

.card{
background:rgba(18,26,51,.92);
backdrop-filter:blur(12px);
border-radius:22px;
padding:25px;
box-shadow:0 0 40px rgba(0,255,213,.12);
}

h2{color:var(--glow)}

.gachaBox{
font-size:32px;
background:#0b132b;
padding:22px;
border-radius:16px;
text-align:center;
margin:18px 0;
min-height:90px;
box-shadow:inset 0 0 14px rgba(0,255,213,.3);
}

button{
background:linear-gradient(135deg,#00ffd5,#00bfff);
border:none;
padding:12px 26px;
border-radius:40px;
font-weight:700;
cursor:pointer;
box-shadow:0 0 18px rgba(0,255,213,.5);
}

input{
padding:10px;
border-radius:30px;
border:none;
width:70%;
}

.list{
max-height:320px;
overflow:auto;
background:#0b132b;
padding:14px;
border-radius:14px;
font-size:14px;
}

.row{
padding:6px 4px;
border-bottom:1px solid rgba(255,255,255,.06);
}
</style>
</head>

<body>

<div class="app">

<div class="card">
<h2>🎰 Gacha Winner</h2>

<div class="gachaBox" id="display">Siap diacak!</div>

<button onclick="gacha()">Gacha</button>

<div style="margin-top:12px">
<input type="password" id="pass" placeholder="Admin password">
<button onclick="unlock()">Unlock</button>
</div>

<h3>🏆 Pemenang</h3>
<div class="list" id="winnerList"></div>
</div>

<div class="card">
<h2>📋 Semua Peserta</h2>
<div class="list" id="userList"></div>
</div>

</div>

<script>
const RAW_JSON = "PASTE_RAW_DATABASE_JSON_URL";
const ADMIN_PASSWORD = "admin123";

let users = [];
let pool = [];
let winners = [];
let admin = false;

async function loadData(){
const res = await fetch(RAW_JSON);
const data = await res.json();

users = data.users.map(u => u.name);
pool = [...users];

renderUsers();
}

loadData();

function renderUsers(){
document.getElementById("userList").innerHTML =
users.map((u,i)=>`<div class="row">${i+1}. ${u}</div>`).join("");
}

function unlock(){
if(document.getElementById("pass").value === ADMIN_PASSWORD){
admin = true;
alert("Admin unlocked!");
}else alert("Password salah!");
}

function gacha(){
if(!admin) return alert("Admin only!");
if(pool.length === 0) return alert("Peserta habis!");

let spin = 0;
const anim = setInterval(()=>{
document.getElementById("display").innerText =
pool[Math.floor(Math.random()*pool.length)];

if(++spin > 25){
clearInterval(anim);
pick();
}
},70);
}

function pick(){
const index = Math.floor(Math.random()*pool.length);
const win = pool.splice(index,1)[0];
winners.push(win);

document.getElementById("display").innerText = "🎉 " + win;

renderWinner();
}

function renderWinner(){
document.getElementById("winnerList").innerHTML =
winners.map((w,i)=>`<div class="row">${i+1}. ${w}</div>`).join("");
}
</script>

</body>
</html>
