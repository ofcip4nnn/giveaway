<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width=1.0">
<title>🎰 Giveaway Gacha</title>

<style>
:root{
--bg:#0b0f1a;
--card:#131a2b;
--glow:#00ffd5;
--text:#e9ecff;
}

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:radial-gradient(circle at top,#18213a,#05070f);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:rgba(19,26,43,.85);
backdrop-filter:blur(12px);
padding:40px;
border-radius:20px;
box-shadow:0 0 40px rgba(0,255,213,.15);
width:90%;
max-width:480px;
text-align:center;
}

h1{color:var(--glow)}

.box{
margin:25px 0;
font-size:28px;
padding:20px;
border-radius:15px;
background:#0d1324;
box-shadow:inset 0 0 10px rgba(0,255,213,.3);
min-height:70px;
display:flex;
align-items:center;
justify-content:center;
}

button{
background:linear-gradient(135deg,#00ffd5,#00bfff);
border:none;
padding:14px 26px;
border-radius:40px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 20px rgba(0,255,213,.5);
transition:.3s;
margin:6px;
}

button:hover{transform:scale(1.05)}

input{
padding:10px;
border-radius:30px;
border:none;
outline:none;
width:70%;
}

.winners{
background:#0d1324;
padding:15px;
border-radius:12px;
max-height:180px;
overflow:auto;
text-align:left;
}

small{opacity:.6}
</style>
</head>

<body>
<div class="container">

<h1>🎁 Giveaway Gacha</h1>
<small>Data dari database.json</small>

<div class="box" id="display">Siap diacak!</div>

<button onclick="startGacha()">🎰 Gacha</button>

<div style="margin-top:15px">
<input type="password" id="pass" placeholder="Admin password">
<button onclick="unlock()">🔐 Unlock</button>
</div>

<h3>🏆 Pemenang</h3>
<div class="winners" id="winnerList"></div>

</div>

<script>
// ===== CONFIG =====
const RAW_JSON = "PASTE_RAW_DATABASE_JSON_URL";
const ADMIN_PASSWORD = "admin123";

// ==================

let participants = [];
let winners = [];
let admin = false;

async function loadData(){
const res = await fetch(RAW_JSON);
const data = await res.json();
participants = data.participants.map(p => p.name);
}

loadData();

function unlock(){
if(document.getElementById("pass").value === ADMIN_PASSWORD){
admin = true;
alert("Admin mode aktif!");
}else{
alert("Password salah!");
}
}

function startGacha(){
if(!admin){
alert("Fitur khusus admin!");
return;
}
if(participants.length === 0){
alert("Peserta habis!");
return;
}

let i = 0;
const anim = setInterval(()=>{
document.getElementById("display").innerText =
participants[Math.floor(Math.random()*participants.length)];
if(++i > 25){
clearInterval(anim);
pickWinner();
}
},80);
}

function pickWinner(){
const index = Math.floor(Math.random()*participants.length);
const winner = participants.splice(index,1)[0];
winners.push(winner);

document.getElementById("display").innerText = "🎉 " + winner;
renderWinners();
}

function renderWinners(){
document.getElementById("winnerList").innerHTML =
winners.map((w,i)=>`${i+1}. ${w}`).join("<br>");
}
</script>
</body>
</html>
