<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Giveaway Gacha Premium</title>

<style>
:root{
--bg:#040712;
--card:rgba(18,26,56,.9);
--glow:#00ffd5;
--accent:#4f7cff;
--text:#eef1ff;
}

body{
margin:0;
font-family:Inter,system-ui,Segoe UI,sans-serif;
background:
radial-gradient(circle at top,#1a2460,#040712);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:1050px;
display:grid;
grid-template-columns:1.2fr .8fr;
gap:30px;
}

.card{
background:var(--card);
backdrop-filter:blur(14px);
border-radius:26px;
padding:34px;
box-shadow:0 0 70px rgba(0,255,213,.14);
border:1px solid rgba(255,255,255,.06);
}

h2{
color:var(--glow);
margin-top:0;
font-size:26px;
}

.gachaBox{
background:#070e2a;
border-radius:20px;
padding:30px;
font-size:40px;
font-weight:800;
text-align:center;
margin:22px 0;
box-shadow:inset 0 0 20px rgba(0,255,213,.4);
min-height:110px;
}

.btn{
background:linear-gradient(135deg,#00ffd5,#4f7cff);
border:none;
padding:14px 34px;
border-radius:60px;
font-size:16px;
font-weight:800;
cursor:pointer;
box-shadow:0 0 28px rgba(0,255,213,.55);
transition:.3s;
}

.btn:hover{transform:scale(1.08)}

.list{
background:#070e2a;
border-radius:20px;
padding:18px;
max-height:420px;
overflow:auto;
}

.row{
padding:9px;
border-bottom:1px solid rgba(255,255,255,.06);
font-size:15px;
}

.counter{
opacity:.7;
font-size:13px;
margin-bottom:10px;
}
</style>

<!-- ===== DATABASE PALING ATAS ===== -->
<script>
const DATABASE = [
 "Asep",
 "Rina",
 "Budi",
 "Salsa",
 "Fikri",
 "Nabila",
 "Rizky",
 "Putri",
 "Agus",
 "Rama"
];
</script>

</head>
<body>

<div class="app">

<div class="card">
<h2>🎰 Gacha Draw</h2>

<div class="gachaBox" id="display">Ready!</div>

<button class="btn" onclick="gacha()">Start Gacha</button>

<h2 style="margin-top:28px">🏆 Winners</h2>
<div class="list" id="winnerList"></div>
</div>

<div class="card">
<h2>📋 Participants</h2>
<div class="counter" id="count"></div>
<div class="list" id="userList"></div>
</div>

</div>

<script>
let pool = [...DATABASE];
let winners = [];

renderUsers();

function renderUsers(){
document.getElementById("count").innerText = `Total peserta: ${pool.length}`;
document.getElementById("userList").innerHTML =
pool.map((u,i)=>`<div class="row">${i+1}. ${u}</div>`).join("");
}

function gacha(){
if(pool.length === 0) return alert("Peserta habis!");

let spin = 0;
const anim = setInterval(()=>{
document.getElementById("display").innerText =
pool[Math.floor(Math.random()*pool.length)];

if(++spin > 30){
clearInterval(anim);
pickWinner();
}
},70);
}

function pickWinner(){
const index = Math.floor(Math.random()*pool.length);
const win = pool.splice(index,1)[0];
winners.push(win);

document.getElementById("display").innerText = "🎉 " + win;

renderWinners();
renderUsers();
}

function renderWinners(){
document.getElementById("winnerList").innerHTML =
winners.map((w,i)=>`<div class="row">${i+1}. ${w}</div>`).join("");
}
</script>

</body>
</html>
