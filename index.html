<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Elegant Giveaway</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

*{box-sizing:border-box}
body{
font-family:Poppins;
margin:0;
background:linear-gradient(135deg,#020617,#1e293b);
color:white;
min-height:100vh;
}

header{
padding:50px 20px;
text-align:center;
animation:fadeDown 1s;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.card{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(12px);
border-radius:20px;
padding:25px;
margin-bottom:25px;
box-shadow:0 0 25px rgba(0,0,0,.5);
animation:fadeUp 1s;
}

h1,h2{text-align:center}

input,button{
width:100%;
padding:14px;
border-radius:14px;
border:none;
font-size:16px;
margin-top:12px;
}

input{
background:#020617;
color:white;
border:1px solid #334155;
}

button{
background:linear-gradient(135deg,#38bdf8,#6366f1);
color:white;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px #38bdf8;
}

.admin-btn{
background:linear-gradient(135deg,#22c55e,#16a34a);
}

.hidden{display:none}

#winner{
font-size:28px;
text-align:center;
margin-top:20px;
animation:glow 1s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px #38bdf8}
to{text-shadow:0 0 30px #6366f1}
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(40px)}
to{opacity:1;transform:translateY(0)}
}

@keyframes fadeDown{
from{opacity:0;transform:translateY(-40px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<header>
<h1>🎁 Simple Elegant Giveaway</h1>
<p>Masukkan nama dan ikut undian sekarang!</p>
</header>

<div class="container">

<div class="card">
<h2>Ikut Giveaway</h2>
<input id="name" placeholder="Nama kamu">
<button onclick="joinGiveaway()">Join Giveaway</button>
<p id="status"></p>
</div>

<div class="card">
<h2>🎰 Gacha Pemenang (Admin)</h2>
<input id="adminPass" placeholder="Password admin">
<button class="admin-btn" onclick="loginAdmin()">Login Admin</button>

<div id="adminPanel" class="hidden">
<button onclick="drawWinner()">Acak Pemenang</button>
<div id="winner"></div>
</div>
</div>

</div>

<script>
let participants = [];

async function loadData(){
  const res = await fetch("database.json");
  participants = await res.json();
}
loadData();

function joinGiveaway(){
  const name = document.getElementById("name").value.trim();
  if(!name){
    alert("Masukkan nama!");
    return;
  }

  participants.push(name);
  status.textContent = "Berhasil ikut giveaway 🎉";
  status.style.color="#38bdf8";
  document.getElementById("name").value="";
}

function loginAdmin(){
  if(adminPass.value === "admin123"){
    adminPanel.classList.remove("hidden");
  }else{
    alert("Bukan admin!");
  }
}

function drawWinner(){
  if(participants.length === 0){
    winner.textContent = "Belum ada peserta!";
    return;
  }

  let spin = 0;
  const anim = setInterval(()=>{
    winner.textContent = participants[Math.floor(Math.random()*participants.length)];
    spin++;

    if(spin > 25){
      clearInterval(anim);
      const final = participants[Math.floor(Math.random()*participants.length)];
      winner.innerHTML = "🏆 Pemenang: <b>"+final+"</b>";
    }
  },100);
}
</script>

</body>
</html>
