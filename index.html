<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Premium Giveaway Gacha</title>

<style>
:root{
--bg:#050812;
--card:rgba(20,30,60,.85);
--glow:#00ffd5;
--accent:#4f7cff;
--text:#eef1ff;
}

body{
margin:0;
font-family:Inter,system-ui,Segoe UI,sans-serif;
background:
radial-gradient(circle at top,#1b2555,#050812);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.wrapper{
width:95%;
max-width:1100px;
display:grid;
grid-template-columns:1.1fr .9fr;
gap:30px;
}

.card{
background:var(--card);
backdrop-filter:blur(14px);
border-radius:24px;
padding:32px;
box-shadow:0 0 60px rgba(0,255,213,.12);
border:1px solid rgba(255,255,255,.05);
}

.title{
font-size:26px;
color:var(--glow);
font-weight:700;
margin-bottom:10px;
}

.gachaBox{
font-size:38px;
font-weight:700;
background:#070d25;
border-radius:18px;
padding:28px;
margin:22px 0;
text-align:center;
box-shadow:inset 0 0 18px rgba(0,255,213,.35);
min-height:100px;
}

.btn{
background:linear-gradient(135deg,#00ffd5,#4f7cff);
border:none;
padding:14px 32px;
border-radius:60px;
font-size:16px;
font-weight:700;
cursor:pointer;
box-shadow:0 0 25px rgba(0,255,213,.5);
transition:.3s;
}

.btn:hover{transform:scale(1.07)}

input{
padding:12px 20px;
border-radius:50px;
border:none;
width:70%;
margin-top:12px;
}

.list{
margin-top:12px;
background:#070d25;
border-radius:18px;
padding:16px;
max-height:360px;
overflow:auto;
}

.row{
padding:8px 6px;
border-bottom:1px solid rgba(255,255,255,.06);
font-size:15px;
}

.counter{
opacity:.7;
font-size:13px;
margin-bottom:8px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="card">
<div class="title">🎰 Gacha Draw</div>

<div class="gachaBox" id="display">Ready!</div>

<button class="btn" onclick="gacha()">Start Gacha</button>

<br>
<input type="password" id="pass" placeholder="Admin password">
<button class="btn" style="margin-top:12px" onclick="unlock()">Unlock</button>

<div class="title" style="margin-top:24px">🏆 Winners</div>
<div class="list" id="winnerList"></div>
</div>

<div class="card">
<div class="title">📋 Participants</div>
<div class="counter" id="count"></div>
<div class="list" id="userList"></div>
</div>

</div>

<script>
const RAW_JSON = "PASTE_RAW_DATABASE_JSON_URL";
const ADMIN_PASSWORD = "admin123";

let pool = [];
let winners = [];
let admin = false;

async function loadData(){
try{
const res = await fetch(RAW_JSON);
const data = await res.json();

if(Array.isArray(data)){
pool = data;
}
else if(data.users){
pool = data.users.map(u=>u.name||u);
}
else if(data.participants){
pool = data.participants.map(p=>p.name||p);
}
else{
console.error("Format JSON tidak dikenali",data);
}

renderUsers();

}catch(e){
console.error("Fetch gagal",e);
}
}

loadData();

function renderUsers(){
document.getElementById("count").innerText = `Total: ${pool.length} peserta`;
document.getElementById("userList").innerHTML =
pool.map((u,i)=>`<div class="row">${i+1}. ${u}</div>`).join("");
}

function unlock(){
if(document.getElementById("pass").value === ADMIN_PASSWORD){
admin = true;
alert("Admin mode aktif!");
}else alert("Password salah!");
}

function gacha(){
if(!admin) return alert("Admin only!");
if(pool.length===0) return alert("Peserta habis!");

let spin=0;
const anim=setInterval(()=>{
document.getElementById("display").innerText=
pool[Math.floor(Math.random()*pool.length)];

if(++spin>28){
clearInterval(anim);
pick();
}
},70);
}

function pick(){
const i=Math.floor(Math.random()*pool.length);
const win=pool.splice(i,1)[0];
winners.push(win);

document.getElementById("display").innerText="🎉 "+win;

renderWinners();
renderUsers();
}

function renderWinners(){
document.getElementById("winnerList").innerHTML =
winners.map((w,i)=>`<div class="row">${i+1}. ${w}</div>`).join("");
}
</script>

</body>
</html>
